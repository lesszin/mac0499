services:

  app:
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}

      METABASE_SITE_URL: ${METABASE_SITE_URL:-http://localhost:8083}

      METABASE_SECRET_KEY: ${METABASE_SECRET_KEY}

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    restart: unless-stopped

    image: postgres:16

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    restart: unless-stopped
    
    image: metabase/metabase:v0.61.3

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${DB_USER}
      MB_DB_PASS: ${DB_PASS}
      MB_DB_HOST: postgres
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:8083}

    depends_on:
      postgres:
        condition: service_healthy
    
  nginx:
    image: nginx:stable-alpine

    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8082}:80"
      - "127.0.0.1:${NGINX_METABASE_PORT:-8083}:81"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app
      - metabase

    restart: unless-stopped


volumes:
  postgres_data: