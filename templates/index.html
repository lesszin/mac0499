<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC0499</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>

    <div class="main-wrapper">
        
        <div id="mapContainer"></div>
        <button
            id="locateButton"
            class="location-button"
            type="button"
            title="Minha localização"
            aria-label="Minha localização">
            <span class="location-dot"></span>
        </button>
        <button
            id="comparisonBackButton"
            class="comparison-back-button d-none"
            type="button"
            title="Voltar para comparação"
            aria-label="Voltar para comparação">
            <i class="bi bi-arrow-left"></i>
        </button>
        <button
            id="spatialAnalysisBackButton"
            class="comparison-back-button d-none"
            type="button"
            title="Voltar para busca"
            aria-label="Voltar para busca">
            <i class="bi bi-arrow-left"></i>
        </button>
        <div class="search-panel">
            <div class="d-flex gap-2 align-items-start">
                <div class="card shadow border-0 flex-grow-1">
                    <div id="schoolSearchBox" class="card-body p-2">
                        <div class="input-group position-relative">
                            <span class="input-group-text bg-white border-0 text-primary">
                                <i class="bi bi-search"></i>
                            </span>
                            <input
                                type="text"
                                id="schoolInput"
                                class="form-control border-0 shadow-none"
                                placeholder="Digite o nome da escola"
                                autocomplete="off">
                            <button
                                type="button"
                                id="clearSchoolInput"
                                class="btn btn-link text-muted border-0 shadow-none d-none"
                                aria-label="Limpar busca">
                                <i class="bi bi-x-circle-fill"></i>
                            </button>
                        </div>
                        <div
                            id="searchSuggestions"
                            class="list-group position-absolute w-100 shadow d-none bg-white">
                        </div>
                    </div>
                    <div id="schoolCard" class="card shadow mt-2 d-none">
                        <div class="card-body position-relative">
                            <button
                                id="closeSchoolCard"
                                class="btn-close position-absolute top-0 end-0 m-2"
                                aria-label="Fechar">
                            </button>
                            <div id="schoolCardBody"></div>
                        </div>
                    </div>
                </div>
                <div
                    id="spatialAnalysisEntry"
                    class="card shadow border-0 bg-white"
                    role="button">
                    <div class="card-body py-2 px-3 d-flex align-items-center gap-3">
                        <span class="fw-bold text-primary text-nowrap">
                            Análise espacial
                        </span>
                        <i class="bi bi-arrow-right text-primary"></i>
                    </div>
                </div>
            </div>
       </div>
       <div class="card shadow border-0 bg-white filters-panel">
            <div
                class="card-header bg-white border-0 d-flex justify-content-between align-items-center py-2 filter-header-cursor"
                data-bs-toggle="collapse"
                data-bs-target="#filtersBody"
                aria-expanded="true"
            >
                <span class="fw-bold text-primary mb-0">
                    Camadas
                </span>
                <i class="bi bi-chevron-down text-primary small collapse-arrow"></i>
            </div>
            <div id="filtersBody" class="collapse">
                <div class="card-body pt-0 pb-3">
                    <div class="mb-2">
                        <div
                            class="d-flex justify-content-between align-items-center py-2 filter-subheader"
                            data-bs-toggle="collapse"
                            data-bs-target="#educationFilters"
                            aria-expanded="false"
                        >
                            <span class="fw-semibold text-dark">
                                Educação
                            </span>
                            <i class="bi bi-chevron-down text-primary small collapse-arrow"></i>
                        </div>
                        <div id="educationFilters" class="collapse">
                            <div class="d-flex flex-column gap-1 mt-1">

                                <div class="form-check">
                                    <input
                                        class="form-check-input modality-filter"
                                        type="checkbox"
                                        value="creche"
                                        id="chk-daycare">
                                    <label
                                        class="form-check-label text-dark"
                                        for="chk-daycare">
                                        Creche
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input
                                        class="form-check-input modality-filter"
                                        type="checkbox"
                                        value="pre_escola"
                                        id="chk-preschool">
                                    <label
                                        class="form-check-label text-dark"
                                        for="chk-preschool">
                                        Pré-escola
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input
                                        class="form-check-input modality-filter"
                                        type="checkbox"
                                        value="fund_ai"
                                        id="chk-elem-early">
                                    <label
                                        class="form-check-label text-dark"
                                        for="chk-elem-early">
                                        Ensino Fundamental Iniciais
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input
                                        class="form-check-input modality-filter"
                                        type="checkbox"
                                        value="fund_af"
                                        id="chk-elem-late">
                                    <label
                                        class="form-check-label text-dark"
                                        for="chk-elem-late">
                                        Ensino Fundamental Finais
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input
                                        class="form-check-input modality-filter"
                                        type="checkbox"
                                        value="medio"
                                        id="chk-high">
                                    <label
                                        class="form-check-label text-dark"
                                        for="chk-high">
                                        Ensino Médio
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input
                                        class="form-check-input modality-filter"
                                        type="checkbox"
                                        value="medio_int"
                                        id="chk-high-int">
                                    <label
                                        class="form-check-label text-dark"
                                        for="chk-high-int">
                                        Ensino Médio Integrado
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input
                                        class="form-check-input modality-filter"
                                        type="checkbox"
                                        value="tecnico"
                                        id="chk-tech">
                                    <label
                                        class="form-check-label text-dark"
                                        for="chk-tech">
                                        Ensino Profissionalizante
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input
                                        class="form-check-input modality-filter"
                                        type="checkbox"
                                        value="eja_fund"
                                        id="chk-eja-elem">
                                    <label
                                        class="form-check-label text-dark"
                                        for="chk-eja-elem">
                                        Ensino EJA Fund.
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input
                                        class="form-check-input modality-filter"
                                        type="checkbox"
                                        value="eja_med"
                                        id="chk-eja-high">
                                    <label
                                        class="form-check-label text-dark"
                                        for="chk-eja-high">
                                        Ensino EJA Médio
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div
                            class="d-flex justify-content-between align-items-center py-2 filter-subheader"
                            data-bs-toggle="collapse"
                            data-bs-target="#administrativeFilters"
                            aria-expanded="false"
                        >
                            <span class="fw-semibold text-dark">
                                Administrativa
                            </span>

                            <i class="bi bi-chevron-down text-primary small collapse-arrow"></i>
                        </div>
                        <div id="administrativeFilters" class="collapse">
                            <div class="mt-1 mb-3">
                                <small class="fw-semibold text-muted">
                                    Dependência Administrativa
                                </small>
                                <div class="d-flex flex-column gap-1 mt-1">
                                    <div class="form-check">
                                        <input
                                            class="form-check-input administrative-filter"
                                            type="checkbox"
                                            value="federal"
                                            id="chk-admin-federal">
                                        <label
                                            class="form-check-label text-dark"
                                            for="chk-admin-federal">
                                            Federal
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input
                                            class="form-check-input administrative-filter"
                                            type="checkbox"
                                            value="estadual"
                                            id="chk-admin-estadual">
                                        <label
                                            class="form-check-label text-dark"
                                            for="chk-admin-estadual">
                                            Estadual
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input
                                            class="form-check-input administrative-filter"
                                            type="checkbox"
                                            value="municipal"
                                            id="chk-admin-municipal">
                                        <label
                                            class="form-check-label text-dark"
                                            for="chk-admin-municipal">
                                            Municipal
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input
                                            class="form-check-input administrative-filter"
                                            type="checkbox"
                                            value="privada"
                                            id="chk-admin-privada">
                                        <label
                                            class="form-check-label text-dark"
                                            for="chk-admin-privada">
                                            Privada
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-1 mb-3">
                                <small class="fw-semibold text-muted">
                                    Categoria de Escola Privada
                                </small>
                                <div class="d-flex flex-column gap-1 mt-1">
                                    <div class="form-check">
                                        <input
                                            class="form-check-input private-category-filter"
                                            type="checkbox"
                                            value="particular"
                                            id="chk-private-particular">
                                        <label
                                            class="form-check-label text-dark"
                                            for="chk-private-particular">
                                            Particular
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input
                                            class="form-check-input private-category-filter"
                                            type="checkbox"
                                            value="comunitaria"
                                            id="chk-private-comunitaria">
                                        <label
                                            class="form-check-label text-dark"
                                            for="chk-private-comunitaria">
                                            Comunitária
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input
                                            class="form-check-input private-category-filter"
                                            type="checkbox"
                                            value="confessional"
                                            id="chk-private-confessional">
                                        <label
                                            class="form-check-label text-dark"
                                            for="chk-private-confessional">
                                            Confessional
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input
                                            class="form-check-input private-category-filter"
                                            type="checkbox"
                                            value="filantropica"
                                            id="chk-private-filantropica">
                                        <label
                                            class="form-check-label text-dark"
                                            for="chk-private-filantropica">
                                            Filantrópica
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-1">
                                <small class="fw-semibold text-muted">
                                    Localização
                                </small>
                                <div class="d-flex flex-column gap-1 mt-1">
                                    <div class="form-check">
                                        <input
                                            class="form-check-input location-filter"
                                            type="checkbox"
                                            value="urbano"
                                            id="chk-location-urbano">
                                        <label
                                            class="form-check-label text-dark"
                                            for="chk-location-urbano">
                                            Urbano
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input
                                            class="form-check-input location-filter"
                                            type="checkbox"
                                            value="rural"
                                            id="chk-location-rural">
                                        <label
                                            class="form-check-label text-dark"
                                            for="chk-location-rural">
                                            Rural
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div
            id="administrativeFilterPanel"
            class="card shadow border-0 bg-white administrative-filter-panel">
            <div
                class="card-header bg-white border-0 d-flex justify-content-between align-items-center py-2 filter-header-cursor"
                data-bs-toggle="collapse"
                data-bs-target="#administrativeFilterBody"
                aria-expanded="false">
                <span class="fw-bold text-primary mb-0">
                    Filtro Avançado
                </span>
                <i class="bi bi-chevron-down text-primary small collapse-arrow"></i>
            </div>
            <div
                id="administrativeFilterBody"
                class="collapse">
                <div class="card-body pt-0 pb-3">
                    <div class="mb-3">
                        <small class="fw-semibold text-muted">
                            País
                        </small>
                        <select
                            id="administrativeCountryFilter"
                            class="form-select form-select-sm mt-1">
                            <option value="" selected disabled>
                                Selecione...
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <small class="fw-semibold text-muted">
                            Grande Região
                        </small>
                        <select
                            id="administrativeRegionFilter"
                            class="form-select form-select-sm mt-1"
                            disabled>
                            <option value="" selected disabled>
                                Selecione...
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <small class="fw-semibold text-muted">
                            Unidade Federativa
                        </small>
                        <select
                            id="administrativeUfFilter"
                            class="form-select form-select-sm mt-1"
                            disabled>

                            <option value="" selected disabled>
                                Selecione...
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <small class="fw-semibold text-muted">
                            Município
                        </small>
                        <select
                            id="administrativeMunicipalityFilter"
                            class="form-select form-select-sm mt-1"
                            disabled>
                            <option value="" selected disabled>
                                Selecione...
                            </option>
                        </select>
                    </div>
                    <button
                        id="confirmAdministrativeFilter"
                        type="button"
                        class="btn btn-primary btn-sm w-100"
                        disabled>
                        Confirmar
                    </button>
                </div>
            </div>
        </div>
        <div
            id="spatialOptionsPanel"
            class="card shadow border-0 bg-white spatial-options-panel d-none">
            <div
                class="card-header bg-white border-0 d-flex justify-content-between align-items-center py-2 filter-header-cursor"
                data-bs-toggle="collapse"
                data-bs-target="#spatialOptionsBody"
                aria-expanded="false">
                <span class="fw-bold text-primary mb-0">
                    Opções
                </span>
                <i class="bi bi-chevron-down text-primary small collapse-arrow"></i>
            </div>
            <div id="spatialOptionsBody" class="collapse">
                <div class="card-body pt-0 pb-3">
                    <div>
                        <div
                            class="d-flex justify-content-between align-items-center py-2 filter-subheader"
                            data-bs-toggle="collapse"
                            data-bs-target="#heatmapOptions"
                            aria-expanded="false">
                            <span class="fw-semibold text-dark">
                                Heatmap
                            </span>
                            <i class="bi bi-chevron-down text-primary small collapse-arrow"></i>
                        </div>
                        <div id="heatmapOptions" class="collapse">
                            <div class="mt-1">
                                <div class="mb-3">
                                    <small class="fw-semibold text-muted">Modalidade</small>
                                    <select id="spatialModalityFilter"
                                            class="form-select form-select-sm mt-1">
                                        <option value="" selected disabled>Selecione...</option>
                                        <option value="creche">Creche</option>
                                        <option value="pre_escola">Pré-Escola</option>
                                        <option value="fund_ai">Ensino Fundamental Iniciais</option>
                                        <option value="fund_af">Ensino Fundamental Finais</option>
                                        <option value="medio">Ensino Médio</option>
                                        <option value="medio_int">Ensino Médio Integrado</option>
                                        <option value="tecnico">Ensino Profissionalizante</option>
                                        <option value="eja_fund">Ensino EJA Fund.</option>
                                        <option value="eja_med">Ensino EJA Médio</option>
                                    </select>
                                </div>
                                <div>
                                    <small class="fw-semibold text-muted">
                                        Dependência Administrativa
                                    </small>
                                    <select id="spatialDependencyFilter"
                                            class="form-select form-select-sm mt-1">
                                        <option value="" selected disabled>Selecione...</option>
                                        <option value="todas">Todas</option>
                                        <option value="municipal">Municipal</option>
                                        <option value="estadual">Estadual</option>
                                        <option value="federal">Federal</option>
                                        <option value="privada">Privada</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div
                                class="d-flex justify-content-between align-items-center py-2 filter-subheader"
                                data-bs-toggle="collapse"
                                data-bs-target="#proportionalSymbolOptions"
                                aria-expanded="false">
                                <span class="fw-semibold text-dark">
                                    Mapa de Símbolo Proporcional
                                </span>
                                <i class="bi bi-chevron-down text-primary small collapse-arrow"></i>
                            </div>
                            <div id="proportionalSymbolOptions" class="collapse">
                                <div class="mt-1">
                                    <div class="mb-3">
                                        <small class="fw-semibold text-muted">
                                            Modalidade
                                        </small>
                                        <select
                                            id="spatialProportionalModalityFilter"
                                            class="form-select form-select-sm mt-1">
                                            <option value="" selected disabled>
                                                Selecione...
                                            </option>
                                            <option value="total">
                                                Total
                                            </option>
                                            <option value="creche">
                                                Creche
                                            </option>
                                            <option value="pre_escola">
                                                Pré-Escola
                                            </option>
                                            <option value="fund_ai">
                                                Ensino Fundamental Iniciais
                                            </option>
                                            <option value="fund_af">
                                                Ensino Fundamental Finais
                                            </option>
                                            <option value="medio">
                                                Ensino Médio
                                            </option>
                                            <option value="medio_int">
                                                Ensino Médio Integrado
                                            </option>
                                            <option value="tecnico">
                                                Ensino Profissionalizante
                                            </option>
                                            <option value="eja_fund">
                                                Ensino EJA Fund.
                                            </option>
                                            <option value="eja_med">
                                                Ensino EJA Médio
                                            </option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <small class="fw-semibold text-muted">
                                            Gênero
                                        </small>
                                        <select
                                            id="spatialProportionalGenderFilter"
                                            class="form-select form-select-sm mt-1">
                                            <option value="" selected disabled>
                                                Selecione...
                                            </option>
                                            <option value="masculino">
                                                Masculino
                                            </option>
                                            <option value="feminino">
                                                Feminino
                                            </option>
                                        </select>
                                    </div>
                                    <div>
                                        <small class="fw-semibold text-muted">
                                            Raça/Cor
                                        </small>
                                        <select
                                            id="spatialProportionalRaceFilter"
                                            class="form-select form-select-sm mt-1">
                                            <option value="" selected disabled>
                                                Selecione...
                                            </option>
                                            <option value="nd">
                                                Não declarada
                                            </option>
                                            <option value="branca">
                                                Branca
                                            </option>
                                            <option value="preta">
                                                Preta
                                            </option>
                                            <option value="parda">
                                                Parda
                                            </option>
                                            <option value="amarela">
                                                Amarela
                                            </option>
                                            <option value="indigena">
                                                Indígena
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    
    <script src="/static/js/main.js"></script>
</body>
</html>
